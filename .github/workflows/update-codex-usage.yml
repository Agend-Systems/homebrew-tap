name: Update Codex Usage cask

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-codex-usage-cask
  cancel-in-progress: true

jobs:
  update:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Resolve latest Codex Usage release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="$(gh release view --repo Agend-Systems/codex-usage-tracker --json tagName --jq .tagName)"
          version="${tag#v}"
          asset_url="https://github.com/Agend-Systems/codex-usage-tracker/releases/download/${tag}/Codex.Usage.app.zip"
          curl --fail --location --retry 3 --output "$RUNNER_TEMP/Codex.Usage.app.zip" "$asset_url"
          sha256="$(shasum -a 256 "$RUNNER_TEMP/Codex.Usage.app.zip" | awk '{print $1}')"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "sha256=$sha256" >> "$GITHUB_OUTPUT"

      - name: Update cask
        env:
          VERSION: ${{ steps.release.outputs.version }}
          SHA256: ${{ steps.release.outputs.sha256 }}
        run: |
          ruby -pi -e '$_ = "  version \"#{ENV.fetch("VERSION")}\"\n" if $_.start_with?("  version ")' Casks/codex-usage.rb
          ruby -pi -e '$_ = "  sha256 \"#{ENV.fetch("SHA256")}\"\n" if $_.start_with?("  sha256 ")' Casks/codex-usage.rb

      - name: Check for an update
        id: changes
        run: |
          if git diff --quiet -- Casks/codex-usage.rb; then
            echo "updated=false" >> "$GITHUB_OUTPUT"
          else
            echo "updated=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Validate updated cask
        if: steps.changes.outputs.updated == 'true'
        run: |
          brew tap --custom-remote Agend-Systems/tap "$GITHUB_WORKSPACE"
          brew style Casks/codex-usage.rb
          brew audit --cask --online Agend-Systems/tap/codex-usage

      - name: Commit updated cask
        if: steps.changes.outputs.updated == 'true'
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Casks/codex-usage.rb
          git commit -m "chore: update codex-usage to ${VERSION}"
          git push
